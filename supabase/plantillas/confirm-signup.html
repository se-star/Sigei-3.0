<!-- Plantilla de SIGEI TIC para Supabase. Pegue todo este contenido en la plantilla correspondiente. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F1F5FA;padding:24px 12px;font-family:Arial,Helvetica,sans-serif;color:#252A34">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#FFFFFF;border-radius:16px;overflow:hidden">
      <tr><td style="background:#0A1F44;padding:22px 28px">
        <img src="https://se-star.github.io/Sigei-3.0/marca/png/logo-horizontal-oscuro-480.png" width="180" alt="SIGEI TIC" style="display:block;border:0;height:auto">
      </td></tr>
      <tr><td style="padding:28px">
        <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;color:#0A1F44">Bienvenido a SIGEI TIC</h1>
        <p style="margin:0 0 12px;font-size:15px;line-height:1.6">Si está ingresando con su número de documento, use este código:</p>
        <p style="margin:16px 0;padding:14px;background:#F1F5FA;border-radius:12px;text-align:center;font-family:'Courier New',monospace;font-size:32px;font-weight:bold;letter-spacing:8px;color:#0A1F44">{{ .Token }}</p>
        <p style="margin:0 0 12px;font-size:15px;line-height:1.6">Si solicitó acceso con correo y contraseña, confirme su correo con este botón:</p>
        <p style="margin:20px 0"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#0050D0;color:#FFFFFF;text-decoration:none;font-weight:bold;font-size:15px;padding:12px 24px;border-radius:999px">Confirmar mi correo</a></p>
      </td></tr>
      <tr><td style="padding:18px 28px;background:#F1F5FA;font-size:12px;line-height:1.5;color:#5A6272">
        SIGEI TIC · Gestión educativa institucional<br>Si usted no pidió este correo, puede ignorarlo.
      </td></tr>
    </table>
  </td></tr>
</table>
